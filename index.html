<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>소현리치랩 이동 중...</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://sohyunrichlab.pages.dev/">
  <script>
    (function () {
      var prefix = "/sohyunrichlab";
      var p = window.location.pathname || "/";
      if (p.indexOf(prefix) === 0) {
        p = p.slice(prefix.length) || "/";
      }
      if (p.charAt(0) !== "/") p = "/" + p;
      window.location.replace("https://sohyunrichlab.pages.dev" + p + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>소현리치랩 페이지가 새 주소로 이동했습니다: <a href="https://sohyunrichlab.pages.dev/">https://sohyunrichlab.pages.dev/</a></p>
</body>
</html>
