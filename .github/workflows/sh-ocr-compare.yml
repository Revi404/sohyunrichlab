# 시험용, 확인 후 삭제
# SH 공고문 쪽 그림(금액 표) 글자 인식 방식 비교. 결과는 실행 로그에만 찍는다(커밋 없음).
name: sh-ocr-compare

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/ocr_compare.py'
      - '.github/workflows/sh-ocr-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: tesseract 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          tesseract --version | head -1

      - name: tessdata_best 받기 (kor, eng)
        run: |
          mkdir -p "$RUNNER_TEMP/tessdata_best"
          for m in kor eng; do
            curl -fL --retry 3 -o "$RUNNER_TEMP/tessdata_best/$m.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_best/raw/main/$m.traineddata"
          done
          ls -l "$RUNNER_TEMP/tessdata_best"

      - name: Pillow 설치
        run: pip install pillow

      - name: PaddleOCR 설치 (실패해도 계속)
        continue-on-error: true
        run: pip install paddlepaddle paddleocr

      - name: 비교 실행
        run: python scripts/ocr_compare.py --tessdata-best "$RUNNER_TEMP/tessdata_best"
