# 시험용, 확인 후 삭제
# SH 공고문 글자 인식(기본 글 + 표 쪽 재인식) 확인. 결과는 실행 로그에만 찍는다(커밋 없음).
name: sh-notice-probe

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/extract_sh_notice.py'
      - '.github/workflows/sh-notice-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 글자 인식 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          mkdir -p "$RUNNER_TEMP/tessdata_best"
          for m in kor eng; do
            curl -fL --retry 3 -o "$RUNNER_TEMP/tessdata_best/$m.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_best/raw/main/$m.traineddata"
          done
          pip install -q pillow
          pip install -q paddlepaddle paddleocr || echo "paddle 설치 실패, tesseract 만 사용"

      - name: sh-313161 읽기 (진단 출력)
        run: python scripts/extract_sh_notice.py --ids sh-313161 --force --debug --tessdata-dir "$RUNNER_TEMP/tessdata_best"
