# 시험용, 확인 후 삭제 (SH 미리보기 변환본 구조 진단)
name: SH 공고문 미리보기 시험

on:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/extract_sh_notice.py'
      - '.github/workflows/sh-notice-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 글자 인식 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor

      - name: Pillow 설치
        run: pip install -q pillow

      - name: 미리보기 변환본 진단
        run: python scripts/extract_sh_notice.py --ids sh-313161 --force --debug
