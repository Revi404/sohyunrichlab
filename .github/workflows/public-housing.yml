name: 공공임대·분양 공고 수집

on:
  schedule:
    # 한국 시간 06:23~22:23 매시간 시도. GitHub 예약 실행은 붐비면 늦어지거나 건너뛰므로
    # (11-11 하루 4번 예약 중 1번만 실행) 촘촘하게 둔다. 정각을 피해 23분.
    - cron: "23 21-23,0-13 * * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "공고문을 뽑을 공고 id (쉼표 구분, 예: lh-0000061207,gh-843). 비우면 자동 대상만"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: public-housing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: LH·마이홈·GH·SH 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect_public_housing.py

      - name: 공고문 PDF에서 글·표 추출 (원본은 저장하지 않음)
        env:
          NOTICE_IDS: ${{ inputs.ids }}
        run: |
          pip install -q pdfplumber
          python scripts/extract_notice.py --auto --max 3 --ids "$NOTICE_IDS"

      - name: SH 공고문 미리보기에서 글 읽기 (쪽 그림을 글자 인식, 그림은 저장하지 않음)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          mkdir -p "$RUNNER_TEMP/tessdata_best"
          for m in kor eng; do
            curl -fL --retry 3 -o "$RUNNER_TEMP/tessdata_best/$m.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_best/raw/main/$m.traineddata"
          done
          pip install -q pillow
          pip install -q paddlepaddle paddleocr || echo "paddle 설치 실패, tesseract 만 사용"
          python scripts/extract_sh_notice.py --auto --max 2 --tessdata-dir "$RUNNER_TEMP/tessdata_best"

      - name: 오늘 뜬 공고 요약 파일 만들기
        run: python scripts/build_public_digest.py

      - name: 수집 결과 저장
        run: |
          git config user.name "sohyunrichlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public_housing.json data/public_housing_digest.json data/notice_text
          if ! git diff --cached --quiet; then
            git commit -m "공공주택 공고 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
