name: SH 주택정보 수집

on:
  schedule:
    - cron: "40 18 * * *"   # 한국 시간 03:40, 하루 한 번 (접속이 적은 시간)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sh-houses
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SH 단지·주택형·평면도·사이버 모델하우스 수집
        run: python scripts/collect_sh_houses.py

      - name: 수집 결과 저장
        run: |
          git config user.name "sohyunrichlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sh_houses.json
          if ! git diff --cached --quiet; then
            git commit -m "SH 주택정보 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
