name: 임대주택 보드 평면도 받기

on:
  push:
    branches: [main]
    paths: ["data/boards/**", "scripts/fetch_floorplans.py", ".github/workflows/floorplans.yml"]
  schedule:
    - cron: "20 19 * * *"   # 한국 시간 04:20, SH 주택정보 수집(03:40) 뒤 하루 한 번
  workflow_dispatch:
    inputs:
      refresh:
        description: "이미 받은 평면도도 전부 다시 받기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: floorplans
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이미지 처리 라이브러리
        run: pip install -q pillow

      - name: 보드에 쓰는 평면도 받아서 줄이기
        run: python scripts/fetch_floorplans.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: 받은 평면도 저장 (화면 반영은 다음 배포 때, 최대 30분)
        if: always()
        run: |
          git config user.name "sohyunrichlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets data
          if ! git diff --cached --quiet; then
            git commit -m "평면도 받기 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
