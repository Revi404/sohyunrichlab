name: 임대주택 보드·블로그 글 만들기

on:
  workflow_run:
    workflows: ["SH 주택정보 수집"]   # 수집이 끝나면 이어서 실행
    types: [completed]
  push:
    branches: [main]
    paths: ["data/boards/**", "data/board_specs.json", "scripts/build_boards.py", "scripts/fetch_floorplans.py", "scripts/build_posts.py", ".github/workflows/floorplans.yml"]
  schedule:
    - cron: "20 21 * * *"   # 한국 시간 06:20, 수집 뒤 실행이 빠졌을 때를 대비해 하루 한 번
  workflow_dispatch:
    inputs:
      refresh:
        description: "이미 받은 평면도도 전부 다시 받기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: floorplans
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이미지 처리 라이브러리
        run: pip install -q pillow

      - name: 새 공고·조건에 맞는 단지로 보드 만들기
        run: python scripts/build_boards.py

      - name: 평면도 받아서 줄이기 (보드용 먼저, 나머지는 조금씩)
        run: python scripts/fetch_floorplans.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: 티스토리에 붙여 넣을 글 만들기
        if: always()
        run: python scripts/build_posts.py

      - name: 결과 저장 (화면 반영은 다음 배포 때, 최대 30분)
        if: always()
        run: |
          git config user.name "sohyunrichlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets data posts
          if ! git diff --cached --quiet; then
            git commit -m "임대주택 보드 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
