name: SH 매입임대 수집

on:
  schedule:
    - cron: "30 16 * * *"   # 한국 시간 01:30, 하루 한 번 (접속이 적은 시간)
  push:
    branches: [main]
    paths: ["scripts/collect_sh_purchased.py", ".github/workflows/sh-purchased.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sh-purchased
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SH 매입다가구·매입원룸 건물·호·도면 주소 수집 (하루 약 450곳)
        run: python scripts/collect_sh_purchased.py

      - name: 수집 결과 저장
        if: always()
        run: |
          git config user.name "sohyunrichlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sh_purchased.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "SH 매입임대 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
