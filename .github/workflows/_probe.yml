name: 임시 시험 조회
on:
  push:
    branches: ["claude/board-automation"]
    paths: ["scripts/_probe_sh.py", ".github/workflows/_probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_probe_sh.py
